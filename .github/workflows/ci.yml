name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # 供 #2 起的集成测试使用(骨架阶段无 DB 测试,先就位)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallflow
          POSTGRES_PASSWORD: wallflow
          POSTGRES_DB: wallflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # 生产构建验证(#12): dist/ 为 Docker runtime 镜像产物
      - name: Build
        working-directory: backend
        run: npm run build

      - name: Test
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgres://wallflow:wallflow@localhost:5432/wallflow_test

      # 内容管道自检(#3): 本地 manifest 导入校验,零上游依赖,防 manifest 回归
      - name: Manifest dry-run
        working-directory: backend
        run: npm run import:dry-run

  # 小程序前端(#10): TypeScript 类型检查 + utils 单测(api/auth/保存状态机/埋点)
  miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: Install
        working-directory: miniprogram
        run: npm ci

      - name: Typecheck
        working-directory: miniprogram
        run: npm run typecheck

      - name: Unit tests
        working-directory: miniprogram
        run: npm test

  # 生产镜像构建验证(#12): 校验 Dockerfile(multi-stage build + runtime 自迁移)
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: wallflow-backend:ci
