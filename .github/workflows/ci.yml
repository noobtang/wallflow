name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # 供 #2 起的集成测试使用(骨架阶段无 DB 测试,先就位)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallflow
          POSTGRES_PASSWORD: wallflow
          POSTGRES_DB: wallflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Test
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgres://wallflow:wallflow@localhost:5432/wallflow_test
